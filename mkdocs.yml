site_name: Resource Diagnostics Monitor
site_description: ROS 2 resource monitoring built on Telegraf or collectd.
site_url: https://bart-van-ingen.github.io/resource_diagnostics_monitor/
repo_url: https://github.com/Bart-van-Ingen/resource_diagnostics_monitor
repo_name: Bart-van-Ingen/resource_diagnostics_monitor
edit_uri: edit/main/

docs_dir: .docs

theme:
  name: material
  logo: images/resource-monitor-lizard-logo.png
  favicon: images/resource-monitor-lizard-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

nav:
  - Home: index.md
  - Motivation: motivation.md
  - Architecture: architecture.md
  - Metric Monitors: metric_monitors.md
  - Learnings: 
      - learnings/index.md
      - Build Command & Clang: learnings/clang_compiler.md
      - Composable Nodes: learnings/composable_nodes.md
      - Intra-Process Communication: learnings/intra_process_communication.md
      - Vendor Packages: learnings/vendor_packages.md
