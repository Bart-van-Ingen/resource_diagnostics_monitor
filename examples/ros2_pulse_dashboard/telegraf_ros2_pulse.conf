# Second telegraf instance for the ros2_pulse Grafana dashboard
#
#   telegraf --config examples/ros2_pulse_dashboard/telegraf_ros2_pulse.conf
#
# Runs next to the resource monitor and its own telegraf, it does not write to the
# unix socket. It serves procstat and the ros2_pulse topic rates on one Prometheus
# endpoint, http://<host>:9273/metrics.

# Global agent configuration
[agent]
  # pulse-export reads the probe log every second, so 1s is enough for both inputs
  interval = "1s"
  round_interval = true
  flush_interval = "1s"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# 1. Process Monitoring, same as resource_diagnostics_utils/config/telegraf.conf
# but also tagged with pid, which is what ros2_pulse labels its metrics with
# https://github.com/influxdata/telegraf/blob/release-1.35/plugins/inputs/procstat/README.md
[[inputs.procstat]]
pattern = ".*__node.*"  # Match all ROS node processes
fieldinclude = ["cpu_time","cpu_usage","memory_usage"]
tag_with = ["cmdline", "pid"]
pid_finder = "native"
tagexclude = ["host", "pattern", "process_name"]

# 2. ros2_pulse topic rates, served by pulse-export
# https://github.com/influxdata/telegraf/blob/release-1.35/plugins/inputs/prometheus/README.md
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:10061/metrics"]
  # Keeps the ros2_pulse metric names as they are, must match outputs.prometheus_client
  metric_version = 2
  tagexclude = ["host", "url"]

###############################################################################
#                          PROCESSOR PLUGINS                                  #
###############################################################################

# Extract node name from ROS process cmdline, same as the default telegraf.conf
[[processors.regex]]
  namepass = ["procstat"]
  [[processors.regex.tags]]
    key = "cmdline"
    pattern = ".*__node:=([^\\s]+)(?:\\s.*|$)"
    replacement = "${1}"
    result_key = "node_name"

# Drop unwanted tags
[[processors.enum]]
  namepass = ["procstat"]
  tagexclude = ["cmdline"]

###############################################################################
#                           OUTPUT PLUGINS                                    #
###############################################################################

# procstat cpu_usage becomes procstat_cpu_usage{node_name, pid} and so on
# https://github.com/influxdata/telegraf/blob/release-1.35/plugins/outputs/prometheus_client/README.md
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # A topic or process that is gone should drop out quickly, not after the 60s default
  expiration_interval = "10s"
  # Only the metrics from the inputs, not telegraf's own go and process metrics
  collectors_exclude = ["gocollector", "process"]
