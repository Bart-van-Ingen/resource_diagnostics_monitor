version: '3.9'
services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  dev:
    # Uncomment if you want to override the service's Dockerfile to one in the .devcontainer
    # folder. Note that the path of the Dockerfile and context is relative to the *primary*
    # docker-compose.yml file (the first in the devcontainer.json "dockerComposeFile"
    # array). The sample below assumes your primary file is in the root of your project.
    #
    # build:
    #   context: .
    #   dockerfile: .devcontainer/Dockerfile

    volumes:
      # Mount the whole repo at the workspace root so non-package files (.docker/, .git,
      # README, .clang-format, etc.) are visible at the top level.
      # Paths are relative to the primary docker-compose.yml file's directory (.docker/).
      - ..:/ros_ws/src:cached

      # VS Code opens /ros_ws (see devcontainer.json), but the repo -- and with it .vscode/ --
      # is mounted one level down at /ros_ws/src. Mount it a second time at /ros_ws/.vscode so
      # settings, tasks and the task scripts' own ./.vscode/tasks/*.sh paths resolve from the
      # workspace root too.
      - ../.vscode:/ros_ws/.vscode:cached
      - ../.claude:/ros_ws/.claude:cached
      - ~/.claude:/home/dev/.claude

      # Personal ROS 2 learnings notes, kept in their own host repo, mounted at the
      # workspace top level so they sit next to src/ in the VS Code explorer.
      - ~/Code/my_ros2_learnings:/ros_ws/learnings:cached

    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    environment:
      # Pin colcon's build/install/log directories to /ros_ws regardless of the cwd a
      # caller happens to be in — a `colcon build` run from inside a package directory
      # would otherwise scatter a second set of artifacts there. Note that --base-paths
      # only controls package discovery, not output location.
      - COLCON_DEFAULTS_FILE=/ros_ws/src/.devcontainer/colcon_defaults.yaml

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
