[project]
name = "resource-diagnostics-monitor"
version = "0.0.0"
description = "Tooling and documentation for the resource_diagnostics_monitor ROS 2 workspace."
requires-python = ">=3.10"
dependencies = ["pytest<9"]

# Not a Python package, this pyproject only carries tooling config and dev
# dependency groups.
[tool.uv]
package = false

# Install with: uv sync --group docs
[dependency-groups]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.6.9"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
detect-same-package = false
force-wrap-aliases = true
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "ros2",
    "first-party",
    "local-folder",
]
default-section = "local-folder"
known-third-party = ["pytest", "yaml"]
known-first-party = ["resource_monitor_interfaces"]
sections.ros2 = ["rclpy", "diagnostic_msgs", "std_msgs", "launch", "launch_ros"]
